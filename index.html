<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PontoView • Relógio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />

<style>
:root{
  --header: linear-gradient(180deg,#2f6f9d 0%,#184c75 55%,#0f3b5e 100%);
  --lineGrad: linear-gradient(90deg,
    rgba(72,190,255,.00) 0%,
    rgba(72,190,255,.75) 22%,
    rgba(84,214,199,.70) 50%,
    rgba(120,132,255,.65) 78%,
    rgba(120,132,255,.00) 100%
  );

  --bg:#ffffff;
  --frame:#eaf1fb;
  --card:#f7f9fd;

  --ink:#0b1626;
  --muted:#5c6a7f;

  --radiusOuter:30px;
  --radius:22px;

  --safe:clamp(12px,2vw,26px);
  --pad:clamp(16px,1.6vw,28px);

  --glass:rgba(255,255,255,.18);
  --glass2:rgba(255,255,255,.10);
  --glassStroke:rgba(255,255,255,.26);
}

*{box-sizing:border-box;}
html,body{height:100%;}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
}

.app{
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ===== Cabeçalho ===== */
header.topbar{
  height:92px;
  padding:0 var(--pad);
  background:var(--header);
  display:flex;
  align-items:center;
  gap:16px;
  color:#fff;
  position:relative;
}

header.topbar::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(720px 180px at 22% 10%, rgba(255,255,255,.20), transparent 62%);
  opacity:.7;
  pointer-events:none;
}

/* 🔲 Badge quadrado (ajuste solicitado) */
.iconBadge{
  width:52px;
  height:52px;
  border-radius:14px; /* quadrado com bordas arredondadas */
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--glass),var(--glass2));
  border:1px solid var(--glassStroke);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.10),
    0 10px 18px rgba(0,0,0,.16);
  backdrop-filter:blur(10px);
}

.material-icons-outlined{
  font-size:26px;
  color:#fff;
}

.title{
  font-size:clamp(18px,2vw,28px);
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
}

/* ===== Conteúdo ===== */
main.stage{
  flex:1;
  display:grid;
  place-items:center;
  padding:var(--safe);
}

.outer{
  width:min(1320px,100%);
  height:min(720px,100%);
  border-radius:var(--radiusOuter);
  background:linear-gradient(180deg,var(--frame),#f4f7fc);
  padding:18px;
}

.card{
  height:100%;
  border-radius:calc(var(--radiusOuter) - 10px);
  background:linear-gradient(180deg,#ffffff,var(--card));
  border:1px solid rgba(15,23,42,.08);
  padding:clamp(20px,2.4vw,32px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

/* ===== Conteúdo principal ===== */
.hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(12px,2vh,18px);
}

.date{
  font-size:clamp(12px,1.8vh,16px);
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(11,22,38,.7);
}

.timeRow{
  display:flex;
  align-items:baseline;
  gap:14px;
}

.hm{
  font-size:clamp(72px,min(12vw,16vh),220px);
  font-weight:900;
  letter-spacing:.02em;
  color:#0b1626;
  line-height:1;
}

.sec{
  font-size:clamp(18px,min(3.2vw,4.8vh),54px);
  font-weight:900;
  color:rgba(11,22,38,.4);
}

.location{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:clamp(12px,1.8vh,16px);
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:rgba(11,22,38,.6);
}

.location .material-icons-outlined{
  font-size:18px;
  color:rgba(11,22,38,.45);
}

/* ===== Rodapé ===== */
footer.footer{
  height:66px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:0 18px;
  border-top:1px solid rgba(15,23,42,.08);
  background:#fff;
  position:relative;
}

.progressLine{
  position:absolute;
  top:0;
  left:18px;
  right:18px;
  height:3px;
  background:var(--lineGrad);
  border-radius:999px;
}

.brand img{
  height:18px;
}
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="iconBadge">
      <span class="material-icons-outlined">access_time</span>
    </div>
    <div class="title">RELÓGIO</div>
  </header>

  <main class="stage">
    <section class="outer">
      <div class="card">
        <div class="hero">
          <div class="date" id="date">DOMINGO • 28 DE DEZEMBRO DE 2025</div>

          <div class="timeRow">
            <div class="hm" id="hm">18:04</div>
            <div class="sec" id="sec">40</div>
          </div>

          <div class="location">
            <span class="material-icons-outlined">location_on</span>
            <span id="location">LOCALIZANDO…</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="progressLine"></div>
    <div class="brand">
      <img src="assets/logo-pontoview.png" alt="">
    </div>
  </footer>
</div>

<script>
const hm=document.getElementById("hm");
const sec=document.getElementById("sec");
const dateEl=document.getElementById("date");

const days=["DOMINGO","SEGUNDA-FEIRA","TERÇA-FEIRA","QUARTA-FEIRA","QUINTA-FEIRA","SEXTA-FEIRA","SÁBADO"];
const months=["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];

const pad=n=>String(n).padStart(2,"0");

function tick(){
  const d=new Date();
  hm.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  sec.textContent=pad(d.getSeconds());
  dateEl.textContent=`${days[d.getDay()]} • ${pad(d.getDate())} DE ${months[d.getMonth()]} DE ${d.getFullYear()}`;
}
tick();
setInterval(tick,1000);

/* Localização */
fetch("https://ipwho.is/")
  .then(r=>r.json())
  .then(d=>{
    if(d.success){
      document.getElementById("location").textContent=
        `${d.city} - ${d.region_code || d.country_code}`.toUpperCase();
    }else{
      document.getElementById("location").textContent="LOCAL INDISPONÍVEL";
    }
  })
  .catch(()=>document.getElementById("location").textContent="LOCAL INDISPONÍVEL");
</script>
</body>
</html>
